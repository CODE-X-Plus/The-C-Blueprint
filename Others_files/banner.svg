<svg width="1000" height="200" viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Ultra-thin, high-density horizontal black and white stripe pattern -->
    <pattern id="bw-horizontal-stripes" width="20" height="2" patternUnits="userSpaceOnUse">
      <rect width="20" height="1" fill="#ffffff" />
      <rect y="1" width="20" height="1" fill="#000000" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 58px;
      font-weight: 800;
      fill: url(#bw-horizontal-stripes);
      stroke: #000000;
      stroke-width: 0.75px;
      letter-spacing: 3px;
      filter: drop-shadow(0px 4px 12px rgba(0, 0, 0, 0.4));
    }
  </style>

  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" class="title-text">THE-C-BLUEPRINT</text>
</svg>

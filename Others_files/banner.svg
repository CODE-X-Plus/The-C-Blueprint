<svg width="1000" height="200" viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Increased line frequency with thinner horizontal black and white stripes -->
    <pattern id="bw-horizontal-stripes" width="20" height="4" patternUnits="userSpaceOnUse">
      <rect width="20" height="2" fill="#ffffff" />
      <rect y="2" width="20" height="2" fill="#000000" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 58px;
      font-weight: 800;
      fill: url(#bw-horizontal-stripes);
      stroke: #000000;
      stroke-width: 1px;
      letter-spacing: 3px;
    }
  </style>

  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" class="title-text">THE-C-BLUEPRINT</text>
</svg>
